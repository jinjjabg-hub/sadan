<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 1200" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&amp;family=Noto+Sans+KR:wght@300;400;500;700&amp;display=swap');
      
      .bg-rect { fill: #fefdf0; }
      
      .title-text {
        font-family: 'Nanum Myeongjo', serif;
        font-weight: 800;
        font-size: 52px;
        fill: #111827;
        letter-spacing: -0.5px;
      }
      
      .body-text {
        font-family: 'Noto Sans KR', sans-serif;
        font-weight: 400;
        font-size: 15.5px;
        fill: #374151;
        letter-spacing: -0.3px;
      }
      
      .body-bold {
        font-weight: 700;
        fill: #0369a1;
      }
      
      .signature-text {
        font-family: 'Nanum Myeongjo', serif;
        font-weight: 700;
        font-size: 20px;
        fill: #111827;
      }
      
      .signature-name {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 2px;
      }
      
      .footer-label {
        font-family: 'Noto Sans KR', sans-serif;
        font-weight: 700;
        font-size: 13px;
        fill: #0369a1;
      }
      
      .footer-value {
        font-family: 'Noto Sans KR', sans-serif;
        font-weight: 400;
        font-size: 13.5px;
        fill: #4b5563;
      }
    </style>
    
    <clipPath id="portrait-clip">
      <rect x="45" y="450" width="280" height="420" rx="36" ry="36" />
    </clipPath>
    
    <!-- Flower Definition 1 (Pink Rose) -->
    <g id="flower-pink">
      <circle cx="0" cy="0" r="10" fill="#facc15" />
      <path d="M 0,-10 C -12,-24 12,-24 0,-10" fill="#fecdd3" />
      <path d="M 0,10 C -12,24 12,24 0,10" fill="#fecdd3" />
      <path d="M -10,0 C -24,-12 -24,12 -10,0" fill="#fecdd3" />
      <path d="M 10,0 C 24,-12 24,12 10,0" fill="#fecdd3" />
      <path d="M -7,-7 C -20,-20 -20,-2 -7,-7" fill="#fda4af" />
      <path d="M 7,7 C 20,20 20,2 7,7" fill="#fda4af" />
      <path d="M -7,7 C -20,2 -20,20 -7,7" fill="#fda4af" />
      <path d="M 7,-7 C 20,-2 20,-20 7,-7" fill="#fda4af" />
    </g>

    <!-- Flower Definition 2 (Yellow) -->
    <g id="flower-yellow">
      <circle cx="0" cy="0" r="8" fill="#eab308" />
      <path d="M 0,-8 C -10,-20 10,-20 0,-8" fill="#fef08a" />
      <path d="M 0,8 C -10,20 10,20 0,8" fill="#fef08a" />
      <path d="M -8,0 C -20,-10 -20,10 -8,0" fill="#fef08a" />
      <path d="M 8,0 C 20,-10 20,10 8,0" fill="#fef08a" />
      <path d="M -6,-6 C -16,-16 -16,-2 -6,-6" fill="#fde047" />
      <path d="M 6,6 C 16,16 16,2 6,6" fill="#fde047" />
      <path d="M -6,6 C -16,2 -16,16 -6,6" fill="#fde047" />
      <path d="M 6,-6 C 16,-2 16,-16 6,-6" fill="#fde047" />
    </g>

    <!-- Leaf Definition -->
    <g id="leaf-green">
      <path d="M 0,0 C 15,-15 35,-5 20,15 C 5,25 -5,15 0,0" fill="#bbf7d0" opacity="0.75" />
      <path d="M 0,0 Q 15,5 20,15" stroke="#86efac" stroke-width="1" fill="none" />
    </g>
  </defs>

  <!-- Solid Background -->
  <rect width="850" height="1200" class="bg-rect" />

  <!-- Watercolor Soft Background Circles -->
  <circle cx="100" cy="150" r="180" fill="#fef08a" opacity="0.15" />
  <circle cx="250" cy="80" r="130" fill="#fecdd3" opacity="0.1" />
  <circle cx="750" cy="1100" r="220" fill="#fecdd3" opacity="0.15" />
  <circle cx="600" cy="1150" r="140" fill="#fed7aa" opacity="0.1" />

  <!-- Top Left Floral Cluster -->
  <use href="#flower-pink" x="90" y="100" transform="scale(1.2)" />
  <use href="#flower-yellow" x="180" y="80" />
  <use href="#flower-pink" x="60" y="220" transform="scale(0.8)" />
  <use href="#flower-yellow" x="120" y="180" transform="scale(0.9)" />
  
  <use href="#leaf-green" x="130" y="120" transform="rotate(30)" />
  <use href="#leaf-green" x="80" y="150" transform="rotate(-45) scale(0.8)" />
  <use href="#leaf-green" x="200" y="100" transform="rotate(15)" />
  <use href="#leaf-green" x="40" y="80" transform="rotate(110)" />

  <!-- Bottom Right Floral Cluster -->
  <use href="#flower-pink" x="760" y="1080" transform="scale(1.3)" />
  <use href="#flower-yellow" x="670" y="1120" transform="scale(1.1)" />
  <use href="#flower-pink" x="790" y="980" transform="scale(0.9)" />
  <use href="#flower-yellow" x="720" y="1030" transform="scale(0.8)" />
  
  <use href="#leaf-green" x="710" y="1060" transform="rotate(210)" />
  <use href="#leaf-green" x="750" y="1000" transform="rotate(150) scale(0.9)" />
  <use href="#leaf-green" x="640" y="1100" transform="rotate(180)" />

  <!-- Floating Flowers Left Margin -->
  <use href="#flower-yellow" x="50" y="380" transform="scale(0.75)" />
  <use href="#flower-pink" x="80" y="410" transform="scale(0.6)" />
  <use href="#leaf-green" x="40" y="420" transform="rotate(60) scale(0.7)" />

  <!-- Main Portrait Photo (Cropped Bottom-Left) -->
  <image href="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&amp;fit=crop&amp;q=80&amp;w=600" 
         x="45" y="450" width="280" height="420" 
         clip-path="url(#portrait-clip)" 
         preserveAspectRatio="xMidYMid slice" />
  
  <!-- Subtle Border Around Portrait Clip -->
  <rect x="45" y="450" width="280" height="420" rx="36" ry="36" fill="none" stroke="#fecdd3" stroke-width="4" opacity="0.5" />

  <!-- Decorative Corner Accent lines around text -->
  <path d="M 720 70 L 780 70 L 780 130" stroke="#fecdd3" stroke-width="3" fill="none" opacity="0.6" />

  <!-- HEADER TITLE (Top Right) -->
  <text x="780" y="130" class="title-text" text-anchor="end">인사말</text>

  <!-- BODY PARAGRAPHS (Right aligned flow, starting x=360 to x=780) -->
  <!-- Paragraph 1 -->
  <text x="360" y="210" class="body-text" font-weight="500" fill="#1f2937">사단법인 마음지키미의 첫 문을 여는 초대 이사장 윤주은입니다.</text>

  <!-- Paragraph 2 -->
  <text x="360" y="260" class="body-text">지금 우리 사회는 겉으로는 화려해 보이지만, 내면은 말할 수 없는 고통과</text>
  <text x="360" y="288" class="body-text">생명 경시의 위기에 처해 있습니다. 저는 이러한 현실을 더 이상 지켜볼 수</text>
  <text x="360" y="316" class="body-text">없다는 절박함과 사명감으로, 뜻을 같이하는 여러분과 함께 이 자리에</text>
  <text x="360" y="344" class="body-text">섰습니다.</text>

  <!-- Paragraph 3 -->
  <text x="360" y="394" class="body-text">마음지키미는 단순한 단체가 아닙니다. 우리는 <tspan class="body-bold">'선제적 예방으로 생명을</tspan></text>
  <text x="360" y="422" class="body-text"><tspan class="body-bold">존중'</tspan>하는 가장 적극적인 실천가들의 연대입니다.</text>

  <!-- Paragraph 4 -->
  <text x="360" y="472" class="body-text">1차 까봐(현실)를 직시하고, 2차 까봐(망상)를 알아차리는 문화를 확산시켜,</text>
  <text x="360" y="500" class="body-text">수많은 이들이 생각의 감옥에서 벗어나 다시 숨 쉴 수 있도록 돕는 구명</text>
  <text x="360" y="528" class="body-text">보트가 될 것입니다.</text>

  <!-- Paragraph 5 -->
  <text x="360" y="578" class="body-text">초대 이사장으로서 저는 우리 법인의 4대 핵심가치를 굳건히 세우겠습니다.</text>

  <!-- Paragraph 6 -->
  <text x="360" y="628" class="body-text"><tspan font-weight="500" fill="#111827">인식개선</tspan>으로 국민의 생각을 전환하고,</text>
  <text x="360" y="656" class="body-text"><tspan font-weight="500" fill="#111827">회복</tspan>을 통해 내면의 치유를 돕고,</text>
  <text x="360" y="684" class="body-text"><tspan font-weight="500" fill="#111827">실천</tspan>으로 삶의 변화를 이끌어내며,</text>
  <text x="360" y="712" class="body-text"><tspan font-weight="500" fill="#111827">책임 있는 자세</tspan>로 사회적 연대를 구축하겠습니다.</text>

  <!-- Paragraph 7 -->
  <text x="360" y="762" class="body-text">여러분의 마음이 평온을 되찾고 건강하게 피어날 수 있도록,</text>
  <text x="360" y="790" class="body-text">마음지키미가 언제나 든든한 동행자가 되겠습니다.</text>

  <!-- SIGNATURE (Bottom Right of content) -->
  <text x="780" y="865" class="signature-text" text-anchor="end">
    사단법인 마음지키미 이사장 <tspan class="signature-name">윤 주 은</tspan> 올림
  </text>

  <!-- Footer Divider -->
  <line x1="45" y1="940" x2="805" y2="940" stroke="#e5e7eb" stroke-width="1.5" />

  <!-- Footer Info Group (Modern Grid style) -->
  <g transform="translate(45, 975)">
    <!-- Phone -->
    <text x="0" y="0" class="footer-label">M</text>
    <text x="25" y="0" class="footer-value">010-4599-2064</text>
    
    <!-- Email -->
    <text x="180" y="0" class="footer-label">E</text>
    <text x="205" y="0" class="footer-value">didava@naver.com</text>

    <!-- Blog -->
    <text x="400" y="0" class="footer-label">BLOG</text>
    <text x="450" y="0" class="footer-value">didava_school</text>
    
    <!-- Instagram -->
    <text x="580" y="0" class="footer-label">INSTAGRAM</text>
    <text x="680" y="0" class="footer-value">@didava_school</text>
    
    <!-- YouTube -->
    <text x="0" y="30" class="footer-label">YOUTUBE</text>
    <text x="80" y="30" class="footer-value">@디다봐TV</text>
  </g>
</svg>
